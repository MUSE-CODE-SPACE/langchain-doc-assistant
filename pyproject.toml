[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-doc-assistant"
version = "0.2.0"
description = "LangChain-powered intelligent document processing and Q&A system with RAG."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yoon K." }]
keywords = ["langchain", "rag", "documents", "flask", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.7,<2",
    "langchain-anthropic>=1.7,<2",
    "flask>=3.1,<4",
    "flask-cors>=6.0,<7",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "numpy>=2.0",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.13",
    "markdown>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "mypy>=1.19",
]
server = [
    "gunicorn>=23.0",
]
rag = [
    "langchain-chroma>=1.0",
    "chromadb>=1.0",
    "faiss-cpu>=1.11",
    "langchain-community>=0.4,<0.5",
    "langchain-huggingface>=1.0",
    "sentence-transformers>=5.0",
]

[project.urls]
Homepage = "https://github.com/MUSE-CODE-SPACE/langchain-doc-assistant"
Repository = "https://github.com/MUSE-CODE-SPACE/langchain-doc-assistant"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
strict_optional = true
